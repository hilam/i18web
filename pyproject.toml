[project]
name = "i18web"
version = "0.1.0"
description = "Esteira de tradução"
authors = [
    {name = "Hildeberto", email = "hildeberto@gmail.com"},
]
requires-python = "<3.14,>=3.13"
license = "MIT"

dependencies = [
    "fastapi>=0.138.0",
    "starlette>=1.3.1",
    "sqlalchemy<3.0.0,>=2.0.50",
    "psycopg2-binary>=2.9.0",
    "python-dotenv<2.0.0,>=1.2.2",
    "idna>=3.15",
    "pygments>=2.20.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.uv]
package = true

[dependency-groups]
dev = [
    "behave<2.0.0,>=1.3.3",
    "mypy>=2.1.0",
    "pytest<10.0.0,>=9.0.3",
    "ruff>=0.15.15",
    "bandit>=1.9.4",
    "pytest-cov>=7.1.0",
]
